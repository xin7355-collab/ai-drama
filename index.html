<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#E9ECE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劇本工坊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI 劇本工坊</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-to-content" href="#view">跳到內容</a>
<header class="top">
  <h1 class="proj-h1">
    <button id="btnProject" class="proj" type="button" aria-haspopup="dialog">
      <span class="proj-label">專案</span>
      <span id="projTitle" class="proj-title">AI 劇本工坊</span>
    </button>
  </h1>
  <button id="btnAI" class="btn-ai" type="button" aria-haspopup="dialog">AI 助手</button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="主要分頁">
  <button type="button" data-tab="plan">企劃</button>
  <button type="button" data-tab="setup">設定</button>
  <button type="button" data-tab="episodes">分集</button>
  <button type="button" data-tab="shots">分鏡</button>
  <button type="button" data-tab="export">匯出</button>
</nav>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle" tabindex="-1"></h2>
    <button type="button" class="sheet-close" data-close>完成</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>這個工具需要開啟 JavaScript。</noscript>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
